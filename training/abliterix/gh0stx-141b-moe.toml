# abliterix run config — gh0stx-141B (pruned Qwen3.5 hybrid MoE), NF4.
# Option: abliterate gh0stx itself to strip any residual refusals WITHOUT another
# SFT round — weight-edit, keeps the domain tuning already baked in. NF4 ~fits GB10.
# Base template: repo configs/qwen3.5_122b_4bit.toml.

[model]
dtype_fallback_order = ["bfloat16"]
quant_method = "bnb_4bit"      # 141B only fits GB10 in 4-bit
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "110GiB", cpu = "40GiB"}

[inference]
batch_size = 0
max_batch_size = 4
max_gen_tokens = 150

[steering]
vector_method = "mean"         # MoE: mean is the tested default (122b used it)
decay_kernel = "linear"
orthogonal_projection = true
weight_normalization = "none"  # per the 122b MoE config
strength_range = [1.0, 10.0]   # MoE wants the wider strength band

[optimization]
num_trials = 25                # MoE trials are expensive; 25 matches the 122b recipe
num_warmup_trials = 10
checkpoint_dir = "checkpoints_gh0stx_141b"

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 5.0

[detection]
llm_judge = true
llm_judge_model = "google/gemini-3.1-flash-lite-preview"
llm_judge_batch_size = 10
llm_judge_concurrency = 10

[display]
print_responses = false
non_interactive = true

[benign_prompts]
dataset = "datasets/good_1000"
split = "train[:800]"
column = "prompt"
[target_prompts]
dataset = "datasets/harmful_1000"
split = "train[:800]"
column = "prompt"
[benign_eval_prompts]
dataset = "datasets/good_1000"
split = "train[800:]"
column = "prompt"
[target_eval_prompts]
dataset = "datasets/harmful_1000"
split = "train[800:]"
column = "prompt"
