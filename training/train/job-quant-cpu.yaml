apiVersion: batch/v1
kind: Job
metadata: {name: gh0stx-quant, namespace: distill}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  activeDeadlineSeconds: 7200
  template:
    metadata: {labels: {app: gh0stx-quant}}
    spec:
      restartPolicy: Never
      serviceAccountName: ai-monitoring-test
      nodeSelector: {karpenter.sh/nodepool: gh0stx-merge-cpu}
      tolerations:
      - {key: gh0stx-merge, effect: NoSchedule}
      containers:
      - name: quant
        image: public.ecr.aws/docker/library/python:3.12
        command: ["bash","/code/entrypoint_quant.sh"]
        env:
        - {name: S3_PREFIX, value: s3://ai-monitoring-test-123456789012/gh0stx-rft}
        - {name: AWS_REGION, value: eu-north-1}
        volumeMounts:
        - {name: work, mountPath: /merged}
        - {name: out, mountPath: /graft_out}
        - {name: code, mountPath: /code}
        resources:
          requests: {cpu: "8", memory: 48Gi}
          limits: {memory: 110Gi}
      volumes:
      - {name: work, emptyDir: {sizeLimit: 320Gi}}
      - {name: out, emptyDir: {sizeLimit: 40Gi}}
      - {name: code, configMap: {name: gh0stx-qlora-code}}
