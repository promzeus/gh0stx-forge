apiVersion: batch/v1
kind: Job
metadata: {name: gh0stx-orpo-commit, namespace: distill}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  activeDeadlineSeconds: 21600   # 6h: ~40min v5-merged download + short ORPO train + merge
  template:
    metadata: {labels: {app: gh0stx-orpo-commit}}
    spec:
      restartPolicy: Never
      serviceAccountName: ai-monitoring-test
      nodeSelector: {karpenter.sh/nodepool: gpu-distill-h200}
      tolerations:
      - {key: test-gpu, effect: NoSchedule}
      containers:
      - name: train
        image: public.ecr.aws/docker/library/python:3.12
        command: ["bash","/code/entrypoint.sh"]
        env:
        - {name: ORPO, value: "1"}
        - {name: BASE_DIR, value: /base}
        # BASE = the v5 merged bf16 (carries all SFT knowledge); ORPO trains the commit
        # behavior on top of it, NOT from the raw fused base.
        - {name: FUSED_S3, value: s3://ai-monitoring-test-123456789012/gh0stx-rft/merged}
        - {name: DATA, value: /data/orpo.jsonl}
        - {name: DATA_S3, value: s3://ai-monitoring-test-123456789012/gh0stx-rft/orpo.jsonl}
        - {name: OUT_DIR, value: /data/adapter}
        - {name: MERGED_DIR, value: /work/merged}
        - {name: MERGED_S3, value: s3://ai-monitoring-test-123456789012/gh0stx-rft/merged_commit}
        - {name: S3_PREFIX, value: s3://ai-monitoring-test-123456789012/gh0stx-rft}
        - {name: AWS_REGION, value: eu-north-1}
        - {name: HF_HOME, value: /work/hf}
        - {name: EPOCHS, value: "4"}
        - {name: LR, value: "1e-5"}
        - {name: ORPO_BETA, value: "0.1"}
        - {name: MAXLEN, value: "256"}
        # DPO peak ~3-4x SFT (chosen+rejected concat + inline reference). Fit via short
        # seqlen + DeepSpeed CPU param offload (frees the resident base for the transient
        # 2.72GB fused-expert gather). NOT TRL activation_offloading (that corrupts backward).
        - {name: DS_CONFIG, value: /code/ds_zero3_offload.json}
        - {name: PRECOMPUTE_REF, value: "0"}
        - {name: ACT_OFFLOAD, value: "0"}
        - {name: GRAD_ACCUM, value: "1"}
        - {name: SAVE_STEPS, value: "50"}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        volumeMounts:
        - {name: base, mountPath: /base}
        - {name: work, mountPath: /work}
        - {name: code, mountPath: /code}
        - {name: data, mountPath: /data}
        - {name: shm, mountPath: /dev/shm}
        resources:
          requests: {cpu: "16", memory: 300Gi, nvidia.com/gpu: 8}
          limits: {memory: 1600Gi, nvidia.com/gpu: 8}
      volumes:
      - {name: base, emptyDir: {sizeLimit: 400Gi}}
      - {name: work, emptyDir: {sizeLimit: 450Gi}}
      - {name: code, configMap: {name: gh0stx-qlora-code}}
      - {name: data, emptyDir: {sizeLimit: 10Gi}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
