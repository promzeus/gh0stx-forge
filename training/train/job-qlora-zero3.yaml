apiVersion: batch/v1
kind: Job
metadata: {name: gh0stx-qlora-zero3, namespace: distill}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  activeDeadlineSeconds: 205200   # 8h ceiling: ~40min fused-base download + ~3-4h train + merge
  template:
    metadata: {labels: {app: gh0stx-qlora-zero3}}
    spec:
      restartPolicy: Never
      serviceAccountName: ai-monitoring-test
      nodeSelector: {karpenter.sh/nodepool: gpu-distill-h200}
      tolerations:
      - {key: test-gpu, effect: NoSchedule}
      containers:
      - name: train
        image: public.ecr.aws/docker/library/python:3.12
        command: ["bash","/code/entrypoint.sh"]
        env:
        - {name: ZERO3, value: "1"}
        - {name: BASE_DIR, value: /base}
        - {name: FUSED_S3, value: s3://ai-monitoring-test-123456789012/decensored_v4_fused}
        - {name: BASE_S3, value: s3://ai-monitoring-test-123456789012/decensored_v4}
        - {name: DATA, value: /data/sft.jsonl}
        - {name: OUT_DIR, value: /data/adapter}
        - {name: MERGED_DIR, value: /work/merged}
        - {name: MERGED_S3, value: s3://ai-monitoring-test-123456789012/gh0stx-rft/merged}
        - {name: S3_PREFIX, value: s3://ai-monitoring-test-123456789012/gh0stx-rft}
        - {name: AWS_REGION, value: eu-north-1}
        - {name: HF_HOME, value: /work/hf}
        - {name: EPOCHS, value: "1"}
        - {name: MAXLEN, value: "8192"}
        # 8 GPUs data-parallel x per_device 1 x accum 1 = effective batch 8 (matches prior run)
        - {name: GRAD_ACCUM, value: "1"}
        - {name: SAVE_STEPS, value: "30"}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        volumeMounts:
        - {name: base, mountPath: /base}
        - {name: work, mountPath: /work}
        - {name: code, mountPath: /code}
        - {name: data, mountPath: /data}
        - {name: shm, mountPath: /dev/shm}
        resources:
          requests: {cpu: "16", memory: 300Gi, nvidia.com/gpu: 8}
          limits: {memory: 1600Gi, nvidia.com/gpu: 8}
      volumes:
      - {name: base, emptyDir: {sizeLimit: 400Gi}}
      - {name: work, emptyDir: {sizeLimit: 450Gi}}
      - {name: code, configMap: {name: gh0stx-qlora-code}}
      - {name: data, emptyDir: {sizeLimit: 60Gi}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
