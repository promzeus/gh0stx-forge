apiVersion: v1
kind: Pod
metadata: {name: gpu-probe, namespace: gh0stx-train, labels: {app: gpu-probe}}
spec:
  restartPolicy: Never
  nodeSelector: {karpenter.sh/nodepool: gh0stx-gpu}
  tolerations:
  - {key: gh0stx-gpu, effect: NoSchedule}
  containers:
  - name: c
    image: public.ecr.aws/docker/library/busybox:1.36
    command: ["sh","-c","echo NODE=$NODE; nvidia-smi -L 2>/dev/null || echo no-smi; sleep 120"]
    env: [{name: NODE, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
    resources: {requests: {nvidia.com/gpu: 8}, limits: {nvidia.com/gpu: 8}}
