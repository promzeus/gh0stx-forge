apiVersion: v1
kind: Pod
metadata:
  name: run397b-cpu
  namespace: distill
  labels: { app: run397b-cpu }
spec:
  restartPolicy: Never
  serviceAccountName: ai-monitoring-test     # pod-identity -> S3
  nodeSelector: { workload: cpu-prune }
  tolerations:
    - { key: "cpu-prune", effect: "NoSchedule", operator: "Exists" }
  containers:
    - name: run
      image: vllm/vllm-openai:latest          # has torch+transformers; runs on CPU here
      command: ["/bin/bash","-lc"]
      args:
        - |
          set -uo pipefail
          echo "[pod] deps"
          python3 -m pip install -q -U transformers accelerate awscli 2>&1 | tail -2 || true
          aws configure set default.s3.max_concurrent_requests 32 || true
          echo "[pod] wait staging marker"
          until aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/_STAGE_COMPLETE" >/dev/null 2>&1; do echo "  wait 30s"; sleep 30; done
          echo "[pod] S3 -> disk sync (gp3 1000MB/s)"
          mkdir -p /model/source /model/run397b
          aws s3 sync "s3://$S3_BUCKET/$S3_PREFIX/" /model/source/ --no-progress 2>&1 | tail -3
          echo "[pod] arch precheck"
          python3 - <<'PY'
          import os, torch
          from transformers import AutoConfig, AutoModelForCausalLM
          c=AutoConfig.from_pretrained(os.environ["MODEL_ID"], trust_remote_code=True)
          print("model_type:", c.model_type, flush=True)
          try:
              with torch.device('meta'): AutoModelForCausalLM.from_config(c, trust_remote_code=True)
              print("ARCH_OK", flush=True)
          except Exception as e:
              print("ARCH_UNSUPPORTED:", repr(e), flush=True); raise SystemExit(3)
          PY
          if [ $? -ne 0 ]; then echo "[pod] ABORT arch"; exit 3; fi
          echo "[pod] Phase A+B on CPU (importance -> prune -> save)"
          python3 /scripts/pipeline_397b.py ; rc=$?
          echo "[pod] sync output -> S3"
          aws s3 sync /model/run397b/ "s3://$S3_BUCKET/output/run397b/" --no-progress 2>&1 | tail -3
          echo "[pod] done rc=$rc"; exit $rc
      env:
        - { name: MODEL_ID, value: "/model/source" }
        - { name: DEVICE_MAP, value: "cpu" }       # CPU-only: no GPU needed for A+B
        - { name: KEEP_FRAC, value: "0.36" }
        - { name: OUT_DIR, value: "/model/run397b" }
        - { name: S3_BUCKET, value: "ai-monitoring-test-123456789012" }
        - { name: S3_PREFIX, value: "qwen3.5-397b-bf16" }
        - { name: AWS_REGION, value: "eu-north-1" }
        - { name: HF_HOME, value: /model/.hf }
        - { name: TMPDIR, value: /model/tmp }
      resources:
        requests: { cpu: "32", memory: 1300Gi }   # forces a >=1.5TB instance; uses all cores at runtime
      volumeMounts:
        - { name: model, mountPath: /model }       # gp3 root (1300Gi, 1000MB/s)
        - { name: scripts, mountPath: /scripts }
  volumes:
    - { name: model, emptyDir: { sizeLimit: 1200Gi } }
    - { name: scripts, configMap: { name: run397b-script } }
