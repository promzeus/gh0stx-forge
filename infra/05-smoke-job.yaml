# Phase 0 smoke test: validate the whole plumbing on a real GPU node BEFORE
# spending hours on the 397B teacher. Uses the vllm image we need next anyway
# (so this also warms the node image cache). No model download here — pure:
#   node provisioning -> NVIDIA driver -> device-plugin (8x GPU) -> image pull
#   -> torch CUDA visibility -> PVC mount/write.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-gpu
  namespace: distill
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: smoke-gpu
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: gpu-distill
      tolerations:
        - key: "gpu-distill"
          effect: "NoSchedule"
          operator: "Exists"
        - key: "nvidia.com/gpu"
          effect: "NoSchedule"
          operator: "Exists"
      containers:
        - name: smoke
          image: vllm/vllm-openai:latest
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "===== nvidia-smi ====="
              nvidia-smi
              echo "===== torch / cuda ====="
              python -c "import torch,transformers; print('torch', torch.__version__, 'cuda?', torch.cuda.is_available(), 'gpus', torch.cuda.device_count()); print('transformers', transformers.__version__)"
              python -c "import vllm; print('vllm', vllm.__version__)" || echo "vllm import skipped"
              echo "===== workspace (PVC) ====="
              df -h /workspace
              echo "smoke-ok $(date -u)" > /workspace/smoke-ok.txt
              cat /workspace/smoke-ok.txt
              ls -la /workspace
              echo "===== SMOKE PASSED ====="
          env:
            - name: HF_HOME
              value: /workspace/hf
            - name: TMPDIR
              value: /workspace/tmp
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "8"
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: distill-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
