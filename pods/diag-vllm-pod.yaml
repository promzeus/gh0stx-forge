# Диагностика арифметики через vLLM (надёжно грузит GDN+MoE+offload). Self-contained: pull→serve→probe→report.
# g6e.24xlarge (4×L40S 192G + 768G RAM), vLLM cpu-offload. pruned_v3c + decensored_v3c BF16. nvfp4 уже: 4/6.
apiVersion: v1
kind: Pod
metadata:
  name: diag-vllm
  namespace: distill
  labels: { app: diag-vllm }
spec:
  restartPolicy: Never
  serviceAccountName: ai-monitoring-test
  nodeSelector:
    workload: nvfp4-quant
    node.kubernetes.io/instance-type: g6e.24xlarge
  tolerations:
    - { key: "test-gpu", effect: "NoSchedule", operator: "Exists" }
    - { key: "nvidia.com/gpu", effect: "NoSchedule", operator: "Exists" }
    - { key: "karpenter.sh/disruption", effect: "NoSchedule", operator: "Exists" }
  containers:
    - name: diag
      image: vllm/vllm-openai:latest
      command: ["/bin/bash","-lc"]
      args:
        - |
          set -uo pipefail
          exec > >(tee -a /data/diag_vllm.log) 2>&1
          B=ai-monitoring-test-123456789012
          python3 -m pip install -q -U awscli 2>&1 | tail -1 || true
          mkdir -p /data/pruned_v3c /data/decensored_v3c /data/tmp
          aws s3 cp s3://$B/heal/vllm_arith_probe.sh /data/vllm_arith_probe.sh >/dev/null; chmod +x /data/vllm_arith_probe.sh
          echo "[pod] pull pruned_v3c $(date -u)";     aws s3 sync s3://$B/pruned_v3c/ /data/pruned_v3c/ --no-progress 2>&1 | tail -1
          echo "[pod] pull decensored_v3c $(date -u)"; aws s3 sync s3://$B/decensored_v3c/ /data/decensored_v3c/ --no-progress 2>&1 | tail -1
          echo "[pod] ===== PROBE pruned_v3c (прунинг) $(date -u) ====="
          bash /data/vllm_arith_probe.sh /data/pruned_v3c || echo "[pod] pruned probe rc=$?"
          echo "[pod] ===== PROBE decensored_v3c (прунинг+абляция) $(date -u) ====="
          bash /data/vllm_arith_probe.sh /data/decensored_v3c || echo "[pod] decensored probe rc=$?"
          echo "[pod] ===== DIAG_VLLM_DONE $(date -u) ====="
          sleep 1800
      env:
        - { name: AWS_REGION, value: "eu-north-1" }
        - { name: HF_HOME, value: "/data/.hf" }
        - { name: TMPDIR, value: "/data/tmp" }
        - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
        - { name: VLLM_LOGGING_LEVEL, value: "WARNING" }
      resources:
        requests: { cpu: "16", memory: 640Gi, nvidia.com/gpu: 4 }
        limits: { nvidia.com/gpu: 4 }
      volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - name: data
      emptyDir: { sizeLimit: 1000Gi }
    - name: dshm
      emptyDir: { medium: Memory, sizeLimit: 32Gi }
