apiVersion: v1
kind: Pod
metadata:
  name: uncensor-v3
  namespace: distill
  labels: { app: uncensor-v3 }
  annotations:
    karpenter.sh/do-not-disrupt: "true"
spec:
  restartPolicy: Never
  serviceAccountName: ai-monitoring-test
  nodeSelector:
    topology.kubernetes.io/zone: eu-north-1c    # PVC AZ
  tolerations:
    - { key: cpu-prune, effect: NoSchedule, operator: Exists }
    - { key: karpenter.sh/disruption, effect: NoSchedule, operator: Exists }
  containers:
    - name: uncensor-v3
      image: vllm/vllm-openai:latest
      command: ["/bin/bash","-lc"]
      args:
        - |
          set -uo pipefail
          mkdir -p /pv 2>/dev/null || true
          exec > >(tee -a /pv/uncensor_v3.log) 2>&1
          B=ai-monitoring-test-123456789012
          echo "[pod] deps $(date -u)"
          python3 -m pip install -q -U accelerate safetensors awscli 2>&1 | tail -1 || true
          python3 -m pip install -q -U "transformers==5.12.1" 2>&1 | tail -1 || true
          mkdir -p /work && cd /work
          aws s3 cp s3://$B/heal/merge_abliterate.py . >/dev/null
          aws s3 cp s3://$B/heal/extra_prompts.json . >/dev/null
          SRC=/pv/run397b_v2/pruned_v2
          if [ ! -f "$SRC/config.json" ]; then
            echo "[pod] pruned_v2 not on PVC -> sync from S3..."
            mkdir -p "$SRC"
            aws s3 sync s3://$B/pruned_v2/ "$SRC"/ --no-progress 2>&1 | tail -1
          fi
          echo "[pod] pruned_v2 size:"; du -sh "$SRC" 2>/dev/null
          echo "[pod] extra_prompts:"; python3 -c "import json; d=json.load(open('extra_prompts.json')); print(f'{len(d)} pairs loaded')"
          echo "[pod] ===== UNCENSOR v3 (1579 pairs, coeff=1.5, norm-preserving) ====="
          ABL_NORM_PRESERVE=1 \
          ABL_DO_OPROJ=1 ABL_DO_GDN_OUT=1 ABL_DO_EXPERT_DOWN=1 ABL_DO_SHARED_DOWN=1 ABL_DO_EMBED=1 \
          ABL_BATCH=8 ABL_SHARD=20GB \
            stdbuf -oL python3 merge_abliterate.py \
              --model "$SRC" --skip-lora \
              --out /pv/run397b_v2/decensored_v3 2>&1 | grep --line-buffered -vE "it/s\]"
          echo "[pod] ===== save decensored_v3 -> S3 ====="
          aws s3 sync /pv/run397b_v2/decensored_v3/ s3://$B/decensored_v3/ --no-progress 2>&1 | tail -1
          echo "[pod] ===== UNCENSOR_V3_DONE $(date -u) ====="
          sleep 600
      env:
        - { name: AWS_REGION, value: "eu-north-1" }
        - { name: HF_HOME, value: "/tmp/hf" }
        - { name: TMPDIR, value: "/tmp" }
      resources:
        requests: { cpu: "40", memory: 600Gi }
      volumeMounts:
        - { name: pv, mountPath: /pv }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - name: pv
      persistentVolumeClaim: { claimName: distill-data }
    - name: tmp
      emptyDir: { sizeLimit: 60Gi }
