# Валидация pruned_v3 (гейт до adjust): test_validate.py по доменам MATH/RU/PRECISION/OFFSEC/CODE/COHERENCE.
# Грузит pruned_v3 с PVC (226GiB BF16, CPU-resident). Сравнить HIT/MISS с v2-baseline (v2 прошёл чисто).
apiVersion: v1
kind: Pod
metadata:
  name: validate-v3
  namespace: distill
  labels: { app: validate-v3 }
  annotations:
    karpenter.sh/do-not-disrupt: "true"
spec:
  restartPolicy: Never
  serviceAccountName: ai-monitoring-test
  nodeSelector:
    topology.kubernetes.io/zone: eu-north-1c    # PVC AZ
  tolerations:
    - { key: cpu-prune, effect: NoSchedule, operator: Exists }
    - { key: karpenter.sh/disruption, effect: NoSchedule, operator: Exists }
  containers:
    - name: validate
      image: vllm/vllm-openai:latest
      command: ["/bin/bash","-lc"]
      args:
        - |
          set -uo pipefail
          exec > >(tee -a /pv/validate_v3.log) 2>&1
          B=ai-monitoring-test-123456789012
          echo "[pod] deps $(date -u)"
          python3 -m pip install -q -U accelerate safetensors awscli 2>&1 | tail -1 || true
          python3 -m pip install -q -U "transformers==5.12.1" 2>&1 | tail -1 || true
          mkdir -p /work && cd /work
          aws s3 cp s3://$B/heal/test_validate.py . >/dev/null
          SRC=/pv/run397b_v3/pruned_v3
          if [ ! -f "$SRC/config.json" ]; then
            echo "[pod] pruned_v3 not on PVC -> sync from S3 (226GiB)..."; mkdir -p "$SRC"
            aws s3 sync s3://$B/pruned_v3/ "$SRC"/ --no-progress 2>&1 | tail -1
          fi
          echo "[pod] pruned_v3:"; du -sh "$SRC" 2>/dev/null
          echo "[pod] ===== VALIDATE pruned_v3 (121.4B, KEEP_FRAC 0.29) — thinking OFF, direct ====="
          TEST_MODEL="$SRC" ENABLE_THINKING=0 MAXTOK=128 python3 test_validate.py 2>&1 | grep --line-buffered -vE "it/s\]"
          echo "[pod] ===== VALIDATE_V3_DONE $(date -u) ====="
          sleep 600
      env:
        - { name: AWS_REGION, value: "eu-north-1" }
        - { name: HF_HOME, value: "/tmp/hf" }
        - { name: TMPDIR, value: "/tmp" }
      resources:
        requests: { cpu: "40", memory: 600Gi }   # 226GiB модель + per-expert->packed merge spike; r7i.24xlarge(768G)/48xlarge
      volumeMounts:
        - { name: pv, mountPath: /pv }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - name: pv
      persistentVolumeClaim: { claimName: distill-data }
    - name: tmp
      emptyDir: { sizeLimit: 60Gi }
