# ФИКС-прунинг v3c: 6 доменов (crypto→offsec), KEEP_FRAC 0.34 → math-слотов ~29 (≈v2). Свежий Phase A + count-saving.
apiVersion: v1
kind: Pod
metadata:
  name: reprune-v3c
  namespace: distill
  labels: { app: reprune-v3c }
  annotations:
    karpenter.sh/do-not-disrupt: "true"
spec:
  restartPolicy: Never
  serviceAccountName: ai-monitoring-test
  nodeSelector:
    topology.kubernetes.io/zone: eu-north-1c
  tolerations:
    - { key: cpu-prune, effect: NoSchedule, operator: Exists }
    - { key: karpenter.sh/disruption, effect: NoSchedule, operator: Exists }
  containers:
    - name: prune
      image: vllm/vllm-openai:latest
      command: ["/bin/bash","-lc"]
      args:
        - |
          set -uo pipefail
          exec > >(tee -a /pv/reprune_v3c.log) 2>&1
          B=ai-monitoring-test-123456789012
          echo "[pod] deps $(date -u)"
          python3 -m pip install -q -U accelerate safetensors awscli datasets 2>&1 | tail -1 || true
          python3 -m pip install -q -U "transformers==5.12.1" 2>&1 | tail -1 || true
          mkdir -p /work/corpus && cd /work
          aws s3 cp s3://$B/heal/pipeline_reap.py . >/dev/null
          aws s3 cp s3://$B/heal/calib_corpus.py . >/dev/null
          aws s3 cp s3://$B/corpus/corpus_offsec.json /work/corpus/ >/dev/null
          aws s3 cp s3://$B/corpus/corpus_crypto.json /work/corpus/ >/dev/null
          echo "[pod] corpus:"; ls -la /work/corpus
          if [ ! -f /pv/397b/config.json ]; then echo "[pod] 397b sync"; mkdir -p /pv/397b; aws s3 sync s3://$B/qwen3.5-397b-bf16/ /pv/397b/ --no-progress 2>&1 | tail -1; fi
          echo "[pod] 397b:"; du -sh /pv/397b 2>/dev/null
          # свежий Phase A: убрать возможные частичные v3c артефакты (importance_v3 НЕ трогаем — reference)
          rm -rf /pv/run397b_v3/pruned_v3c /pv/run397b_v3/importance_v3c.json /pv/run397b_v3/counts_v3c.json 2>/dev/null || true
          # чистим мусорный дубль pruned_v3b (~226G на PVC, был провальной диагностикой) + importance_v3b
          rm -rf /pv/run397b_v3/pruned_v3b /pv/run397b_v3/importance_v3b.json /pv/run397b_v3/prune_result_v3b.json 2>/dev/null || true
          echo "[pod] PVC:"; df -h /pv | tail -1
          echo "[pod] ===== RE-PRUNE v3c (6 доменов crypto→offsec, KEEP_FRAC 0.34, свежий Phase A + count-saving) ====="
          MODEL_ID=/pv/397b OUT_DIR=/pv/run397b_v3 DEVICE_MAP=cpu CORPUS_DIR=/work/corpus \
            PRUNE_VER=v3c CALIB_TARGET=1024 MAXLEN=2048 USE_HF=1 KEEP_FRAC=0.34 \
            python3 pipeline_reap.py 2>&1 | grep -vE "it/s\]"
          echo "[pod] ===== save pruned_v3c + importance/counts -> S3 ====="
          aws s3 sync /pv/run397b_v3/pruned_v3c/ s3://$B/pruned_v3c/ --no-progress 2>&1 | tail -1
          aws s3 cp /pv/run397b_v3/importance_v3c.json s3://$B/pruned_v3c_importance.json 2>&1 | tail -1 || true
          aws s3 cp /pv/run397b_v3/counts_v3c.json s3://$B/pruned_v3c_counts.json 2>&1 | tail -1 || true
          aws s3 cp /pv/run397b_v3/prune_result_v3c.json s3://$B/pruned_v3c_result.json 2>&1 | tail -1 || true
          echo "[pod] ===== REPRUNE_V3C_DONE $(date -u) ====="
          sleep 300
      env:
        - { name: AWS_REGION, value: "eu-north-1" }
        - { name: HF_HOME, value: "/tmp/hf" }
        - { name: TMPDIR, value: "/tmp" }
      resources:
        requests: { cpu: "80", memory: 1400Gi }
      volumeMounts:
        - { name: pv, mountPath: /pv }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - name: pv
      persistentVolumeClaim: { claimName: distill-data }
    - name: tmp
      emptyDir: { sizeLimit: 60Gi }
