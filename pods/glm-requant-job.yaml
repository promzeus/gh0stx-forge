# GLM-4.6 NVFP4A16 GPTQ re-quant with self-distilled reasoning calibration.
# W4A16 (RTN, no calib) AND W4A4 (ultrachat calib) both degenerated into loops on
# gx10 -> weight-quant quality defect, not activations/sampling. This run fixes the
# weight rounding: GPTQ (Hessian error-compensation) on self-distilled <think>
# traces, NVFP4A16 (weights FP4, activations bf16). One node, three phases:
# (1) gen_calib.py generates reasoning traces from bf16 (GPU), (2) nvfp4_quant.py
# GPTQ-quantizes with NVFP4_CALIB_JSONL (CPU-resident, per-block GPU onload),
# (3) push to glm46-nvfp4-gptq (NEW prefix; leaves the bad glm46-nvfp4 / -nvfp4a16
# untouched for comparison). Coherence can only be tested on GB10 (gx10) after
# transfer, not here (no sm_121a).
apiVersion: batch/v1
kind: Job
metadata:
  name: glm-requant
  namespace: distill
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 25200
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: { app: glm-requant }
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: ai-monitoring-test
      nodeSelector:
        workload: glm-requant
      tolerations:
        - { key: nvidia.com/gpu, effect: NoSchedule, operator: Exists }
        - { key: karpenter.sh/disruption, effect: NoSchedule, operator: Exists }
      containers:
        - name: requant
          image: vllm/vllm-openai:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -uo pipefail
              B=ai-monitoring-test-123456789012
              echo "[job] deps $(date -u)"
              python3 -m pip install -q -U llmcompressor==0.14.0 accelerate datasets safetensors huggingface_hub hf_xet sentencepiece tiktoken blobfile awscli 2>&1 | tail -2 || true
              python3 -m pip install -q -U transformers 2>&1 | tail -1 || true
              export HF_HOME=/data/.hf TMPDIR=/data/tmp PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              mkdir -p /data/pruned /data/nvfp4 /data/scripts /data/tmp /data/.hf && cd /data/scripts
              aws s3 cp s3://$B/glm46/gen_calib.py ./gen_calib.py
              aws s3 cp s3://$B/glm46/nvfp4_quant.py ./nvfp4_quant.py
              if aws s3 ls s3://$B/glm46-nvfp4-gptq/_NVFP4_COMPLETE >/dev/null 2>&1; then
                echo "[job] === RESUME: glm46-nvfp4-gptq already in S3 ==="; echo "[job] === GLM46_REQUANT_DONE $(date -u) ==="; sleep 30; exit 0
              fi
              echo "[job] pull glm46-pruned $(date -u)"
              aws s3 sync s3://$B/glm46-pruned/ /data/pruned/ --no-progress 2>&1 | tail -1
              test -f /data/pruned/config.json || { echo "[job] FATAL: pruned config.json missing"; exit 1; }
              nvidia-smi -L 2>&1 | head -1 || true
              echo "[job] === GEN CALIB (128 self-distilled reasoning traces) $(date -u) ==="
              GEN_IN=/data/pruned GEN_OUT=/data/calib.jsonl GEN_SAMPLES=128 GEN_MAXNEW=512 python3 gen_calib.py; grc=$?
              if [ $grc -ne 0 ]; then echo "[job] GEN_FAILED rc=$grc"; sleep 5; exit $grc; fi
              test -s /data/calib.jsonl || { echo "[job] FATAL: empty calib.jsonl"; exit 1; }
              aws s3 cp /data/calib.jsonl s3://$B/glm46/calib_selfdistill.jsonl
              echo "[job] === NVFP4A16 GPTQ REQUANT (self-distilled reasoning calib) $(date -u) ==="
              NVFP4_IN=/data/pruned NVFP4_OUT=/data/nvfp4 NVFP4_SAMPLES=128 NVFP4_MAXSEQ=2048 \
                NVFP4_SCHEME=NVFP4A16 NVFP4_MODIFIER=gptq \
                NVFP4_CALIB_JSONL=/data/calib.jsonl python3 nvfp4_quant.py; frc=$?
              if [ $frc -ne 0 ]; then echo "[job] REQUANT_FAILED rc=$frc"; sleep 5; exit $frc; fi
              echo "[job] output size:"; du -sh /data/nvfp4
              echo "[job] === PUSH glm46-nvfp4-gptq -> S3 $(date -u) ==="
              aws s3 sync /data/nvfp4 s3://$B/glm46-nvfp4-gptq/ --no-progress 2>&1 | tail -2
              echo ok | aws s3 cp - s3://$B/glm46-nvfp4-gptq/_NVFP4_COMPLETE
              echo "[job] === GLM46_REQUANT_DONE $(date -u) ==="
          env:
            - { name: AWS_REGION, value: "eu-north-1" }
            - { name: HF_HOME, value: "/data/.hf" }
            - { name: TMPDIR, value: "/data/tmp" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources:
            requests: { cpu: "48", memory: 900Gi, nvidia.com/gpu: 8 }
            limits: { nvidia.com/gpu: 8 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 780Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
